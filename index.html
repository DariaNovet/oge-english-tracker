<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ОГЭ Английский</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="./data/tasks.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #202124;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        h2 {
            margin-top: 0;
        }

        .subtitle {
            color: #777;
            margin-bottom: 22px;
        }

        /* =========================
           ПОИСК
        ========================= */

        .search-box {
            background: white;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        .search-title {
            font-weight: 700;
            font-size: 17px;
            margin-bottom: 10px;
        }

        .search-input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d8dce5;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            background: #f8f9fc;
        }

        .search-input:focus {
            border-color: #6c63ff;
            background: white;
        }

        .search-results {
            margin-top: 12px;
        }

        .search-result {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 13px;
            margin-top: 8px;
            cursor: pointer;
            border: 1px solid #e4e6ed;
        }

        .search-result:hover {
            background: #f0efff;
        }

        .search-result-title {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .search-result-code {
            font-family: monospace;
            color: #666;
        }

        .search-result-status {
            margin-top: 6px;
            font-size: 13px;
            color: #777;
        }

        .search-empty {
            color: #777;
            font-size: 14px;
            margin-top: 10px;
        }

        /* =========================
           РАЗДЕЛЫ
        ========================= */

        .sections {
            display: grid;
            gap: 12px;
        }

        .section {
            background: white;
            padding: 18px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
            font-size: 17px;
            font-weight: 700;
        }

        .section:hover {
            background: #f8f7ff;
        }

        /* =========================
           СТРАНИЦЫ
        ========================= */

        .page {
            display: none;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 16px;
            padding: 9px 14px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid #ddd;
        }

        /* =========================
           ВАРИАНТЫ И ЗАДАНИЯ
        ========================= */

        .variant {
            margin-bottom: 24px;
        }

        .variant-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .task-card {
            background: white;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 8px;
            cursor: pointer;
            border: 1px solid #e5e7ed;
        }

        .task-card:hover {
            background: #fafaff;
        }

        .task-top {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        .task-name {
            font-weight: 700;
        }

        .task-code {
            font-family: monospace;
            color: #666;
            margin-top: 5px;
        }

        .task-status {
            margin-top: 8px;
            font-size: 14px;
            color: #777;
        }

        .status-correct {
            color: #258a48;
            font-weight: 600;
        }

        .status-wrong {
            color: #d43b3b;
            font-weight: 600;
        }

        /* =========================
           СТАТИСТИКА
        ========================= */

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 14px;
            padding: 16px;
        }

        .stat-number {
            font-size: 25px;
            font-weight: 700;
        }

        .stat-label {
            color: #777;
            margin-top: 5px;
        }

        /* =========================
           ОШИБКИ
        ========================= */

        .error-card {
            background: white;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .error-card:hover {
            background: #fffafa;
        }

        .error-title {
            font-weight: 700;
        }

        .error-code {
            font-family: monospace;
            color: #666;
            margin-top: 4px;
        }

        .error-count {
            color: #d43b3b;
            font-size: 14px;
            margin-top: 6px;
        }

        .error-text {
            margin-top: 10px;
            color: #444;
            white-space: pre-wrap;
        }

        /* =========================
           МОДАЛЬНОЕ ОКНО
        ========================= */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .modal {
            background: white;
            max-width: 600px;
            margin: 30px auto;
            border-radius: 20px;
            padding: 20px;
        }

        .modal-title {
            font-size: 21px;
            font-weight: 700;
        }

        .modal-code {
            font-family: monospace;
            color: #666;
            margin: 8px 0 18px;
        }

        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .modal-button {
            border: none;
            padding: 13px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        .correct-button {
            background: #dff5e5;
        }

        .wrong-button {
            background: #ffe2e2;
        }

        .close-button {
            margin-top: 10px;
            width: 100%;
            background: #eee;
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
        }

        .wrong-form {
            margin-top: 16px;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            resize: vertical;
            margin-top: 10px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #d8dce5;
            font-family: inherit;
            font-size: 15px;
        }

        .save-button {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: #6c63ff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        /* =========================
           ИСТОРИЯ
        ========================= */

        .history {
            margin-top: 20px;
        }

        .history-title {
            font-weight: 700;
            margin-bottom: 10px;
        }

        .history-item {
            background: #f6f7fa;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .history-result {
            font-weight: 700;
        }

        .history-date {
            color: #777;
            font-size: 13px;
            margin-top: 4px;
        }

        .history-error {
            margin-top: 8px;
            white-space: pre-wrap;
        }

        .history-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }

        .small-button {
            border: none;
            border-radius: 8px;
            padding: 7px 10px;
            cursor: pointer;
        }

        .edit-button {
            background: #e7e5ff;
        }

        .delete-button {
            background: #ffe0e0;
        }

        .empty {
            background: white;
            border-radius: 14px;
            padding: 18px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         ГЛАВНАЯ
    ========================= -->

    <div id="homePage" class="page" style="display: block;">

        <h1>ОГЭ Английский</h1>

        <div class="subtitle">
            Трекер подготовки
        </div>

        <!-- ПОИСК -->

        <div class="search-box">

            <div class="search-title">
                🔎 Поиск по коду задания
            </div>

            <input
                id="searchInput"
                class="search-input"
                type="text"
                placeholder="Введите код, например 42BF66"
                autocomplete="off"
                oninput="searchTasks()"
            >

            <div id="searchResults" class="search-results"></div>

        </div>

        <!-- РАЗДЕЛЫ -->

        <div class="sections">

            <div class="section" onclick="openSection('1-5')">
                1–5
            </div>

            <div class="section" onclick="openSection('6-11')">
                6–11
            </div>

            <div class="section" onclick="openSection('12')">
                12
            </div>

            <div class="section" onclick="openSection('13-19')">
                13–19
            </div>

            <div class="section" onclick="openSection('20-28')">
                20–28
            </div>

            <div class="section" onclick="openSection('29-34')">
                29–34
            </div>

            <div class="section" onclick="openStats()">
                📊 Статистика
            </div>

            <div class="section" onclick="openErrors()">
                ❌ Мои ошибки
            </div>

        </div>

    </div>


    <!-- =========================
         РАЗДЕЛ
    ========================= -->

    <div id="sectionPage" class="page">

        <div class="back-button" onclick="goHome()">
            ← Назад
        </div>

        <h2 id="sectionTitle"></h2>

        <div id="sectionContent"></div>

    </div>


    <!-- =========================
         СТАТИСТИКА
    ========================= -->

    <div id="statsPage" class="page">

        <div class="back-button" onclick="goHome()">
            ← Назад
        </div>

        <h2>📊 Статистика</h2>

        <div id="statsContent"></div>

    </div>


    <!-- =========================
         МОИ ОШИБКИ
    ========================= -->

    <div id="errorsPage" class="page">

        <div class="back-button" onclick="goHome()">
            ← Назад
        </div>

        <h2>❌ Мои ошибки</h2>

        <div id="errorsContent"></div>

    </div>

</div>


<!-- =========================
     МОДАЛЬНОЕ ОКНО ЗАДАНИЯ
========================= -->

<div id="modalOverlay" class="modal-overlay">

    <div class="modal">

        <div id="modalTitle" class="modal-title"></div>

        <div id="modalCode" class="modal-code"></div>

        <div class="modal-buttons">

            <button
                class="modal-button correct-button"
                onclick="saveCorrectAttempt()"
            >
                ✓ Верно
            </button>

            <button
                class="modal-button wrong-button"
                onclick="showWrongForm()"
            >
                ✕ Неверно
            </button>

        </div>


        <!-- ФОРМА ОШИБКИ -->

        <div id="wrongForm" class="wrong-form" style="display: none;">

            <div>
                В чём была ошибка?
            </div>

            <textarea
                id="wrongText"
                placeholder="Напишите своими словами, что было неправильно..."
            ></textarea>

            <button
                class="save-button"
                onclick="saveWrongAttempt()"
            >
                Сохранить ошибку
            </button>

        </div>


        <!-- ИСТОРИЯ -->

        <div class="history">

            <div class="history-title">
                История попыток
            </div>

            <div id="historyContent"></div>

        </div>


        <button
            class="close-button"
            onclick="closeModal()"
        >
            Закрыть
        </button>

    </div>

</div>


<script>

    /* =====================================================
       НАСТРОЙКИ
    ===================================================== */

    const STORAGE_KEY = "oge_english_tracker_attempts";

    let selectedTask = null;


    /* =====================================================
       LOCAL STORAGE
    ===================================================== */

    function getAttempts() {

        try {

            const data = localStorage.getItem(STORAGE_KEY);

            if (!data) {
                return [];
            }

            const parsed = JSON.parse(data);

            return Array.isArray(parsed) ? parsed : [];

        } catch (error) {

            console.error("Ошибка чтения данных:", error);

            return [];
        }
    }


    function saveAttempts(attempts) {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(attempts)
        );
    }


    /* =====================================================
       ПОИСК
    ===================================================== */

    function searchTasks() {

        const input = document
            .getElementById("searchInput")
            .value
            .trim()
            .toUpperCase();

        const results = document.getElementById("searchResults");

        results.innerHTML = "";


        if (!input) {
            return;
        }


        const found = TASKS.filter(function(task) {

            const code = String(task.code).toUpperCase();

            const variant = String(task.variant);

            const number = String(task.number);

            return (
                code.includes(input) ||
                variant.includes(input) ||
                number.includes(input)
            );

        });


        if (found.length === 0) {

            results.innerHTML = `
                <div class="search-empty">
                    Ничего не найдено
                </div>
            `;

            return;
        }


        found.forEach(function(task) {

            const status = getTaskStatus(task.id);

            const result = document.createElement("div");

            result.className = "search-result";

            result.innerHTML = `
                <div class="search-result-title">
                    Вариант ${task.variant} · Задание ${task.number}
                </div>

                <div class="search-result-code">
                    ${escapeHtml(task.code)}
                </div>

                <div class="search-result-status">
                    ${status.text}
                </div>
            `;

            result.onclick = function() {

                openTask(task);

            };

            results.appendChild(result);

        });

    }


    /* =====================================================
       ГЛАВНАЯ / НАВИГАЦИЯ
    ===================================================== */

    function hideAllPages() {

        document.getElementById("homePage").style.display = "none";

        document.getElementById("sectionPage").style.display = "none";

        document.getElementById("statsPage").style.display = "none";

        document.getElementById("errorsPage").style.display = "none";

    }


    function goHome() {

        hideAllPages();

        document.getElementById("homePage").style.display = "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /* =====================================================
       ОТКРЫТИЕ РАЗДЕЛА
    ===================================================== */

    function openSection(section) {

        hideAllPages();

        document.getElementById("sectionPage").style.display = "block";

        const title = document.getElementById("sectionTitle");

        const content = document.getElementById("sectionContent");

        title.textContent = "Задания " + section;

        content.innerHTML = "";


        /*
            Пока реальные коды есть только для раздела 1–5.
        */

        if (section !== "1-5") {

            content.innerHTML = `
                <div class="empty">
                    Задания пока не добавлены.
                </div>
            `;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

            return;
        }


        for (let variant = 1; variant <= 19; variant++) {

            const variantTasks = TASKS.filter(function(task) {

                return task.variant === variant;

            });


            if (variantTasks.length === 0) {
                continue;
            }


            const variantBlock = document.createElement("div");

            variantBlock.className = "variant";


            const variantTitle = document.createElement("div");

            variantTitle.className = "variant-title";

            variantTitle.textContent = "Вариант " + variant;


            variantBlock.appendChild(variantTitle);


            variantTasks.forEach(function(task) {

                const card = createTaskCard(task);

                variantBlock.appendChild(card);

            });


            content.appendChild(variantBlock);

        }


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /* =====================================================
       СОЗДАНИЕ КАРТОЧКИ ЗАДАНИЯ
    ===================================================== */

    function createTaskCard(task) {

        const card = document.createElement("div");

        card.className = "task-card";

        const status = getTaskStatus(task.id);


        let statusClass = "";

        if (status.result === "correct") {

            statusClass = "status-correct";

        } else if (status.result === "wrong") {

            statusClass = "status-wrong";

        }


        card.innerHTML = `

            <div class="task-top">

                <div class="task-name">
                    Задание ${task.number}
                </div>

            </div>

            <div class="task-code">
                ${escapeHtml(task.code)}
            </div>

            <div class="task-status ${statusClass}">
                ${status.text}
            </div>

        `;


        card.onclick = function() {

            openTask(task);

        };


        return card;

    }


    /* =====================================================
       СТАТУС ЗАДАНИЯ
    ===================================================== */

    function getTaskStatus(taskId) {

        const attempts = getAttempts().filter(function(attempt) {

            return attempt.taskId === taskId;

        });


        if (attempts.length === 0) {

            return {
                text: "Не выполнено",
                result: null
            };

        }


        const lastAttempt = attempts[attempts.length - 1];


        if (lastAttempt.result === "correct") {

            return {
                text: "✓ Верно",
                result: "correct"
            };

        }


        return {
            text: "✕ Ошибка",
            result: "wrong"
        };

    }


    /* =====================================================
       ОТКРЫТИЕ ЗАДАНИЯ
    ===================================================== */

    function openTask(task) {

        selectedTask = task;


        document.getElementById("modalTitle").textContent =
            "Вариант " +
            task.variant +
            " · Задание " +
            task.number;


        document.getElementById("modalCode").textContent =
            "Код: " + task.code;


        document.getElementById("wrongForm").style.display = "none";

        document.getElementById("wrongText").value = "";


        document.getElementById("modalOverlay").style.display = "block";

        renderHistory();


        document.body.style.overflow = "hidden";

    }


    /* =====================================================
       ЗАКРЫТИЕ МОДАЛЬНОГО ОКНА
    ===================================================== */

    function closeModal() {

        document.getElementById("modalOverlay").style.display = "none";

        document.body.style.overflow = "";

        selectedTask = null;

    }


    /* =====================================================
       ФОРМА ОШИБКИ
    ===================================================== */

    function showWrongForm() {

        document.getElementById("wrongForm").style.display = "block";

        document.getElementById("wrongText").focus();

    }


    /* =====================================================
       СОХРАНЕНИЕ «ВЕРНО»
    ===================================================== */

    function saveCorrectAttempt() {

        if (!selectedTask) {
            return;
        }


        const attempts = getAttempts();


        attempts.push({

            id: Date.now().toString(),

            taskId: selectedTask.id,

            variant: selectedTask.variant,

            number: selectedTask.number,

            code: selectedTask.code,

            result: "correct",

            errorText: "",

            date: new Date().toISOString()

        });


        saveAttempts(attempts);


        renderHistory();

        updateVisibleContent();


        alert("Результат сохранён: ✓ Верно");

    }


    /* =====================================================
       СОХРАНЕНИЕ «НЕВЕРНО»
    ===================================================== */

    function saveWrongAttempt() {

        if (!selectedTask) {
            return;
        }


        const textarea = document.getElementById("wrongText");

        const errorText = textarea.value.trim();


        if (!errorText) {

            alert("Напишите, в чём была ошибка.");

            textarea.focus();

            return;
        }


        const attempts = getAttempts();


        attempts.push({

            id: Date.now().toString(),

            taskId: selectedTask.id,

            variant: selectedTask.variant,

            number: selectedTask.number,

            code: selectedTask.code,

            result: "wrong",

            errorText: errorText,

            date: new Date().toISOString()

        });


        saveAttempts(attempts);


        textarea.value = "";

        document.getElementById("wrongForm").style.display = "none";


        renderHistory();

        updateVisibleContent();


        alert("Ошибка сохранена.");

    }


    /* =====================================================
       ИСТОРИЯ ПО ЗАДАНИЮ
    ===================================================== */

    function renderHistory() {

        const container = document.getElementById("historyContent");

        container.innerHTML = "";


        if (!selectedTask) {
            return;
        }


        const attempts = getAttempts().filter(function(attempt) {

            return attempt.taskId === selectedTask.id;

        });


        if (attempts.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    Попыток пока нет.
                </div>
            `;

            return;
        }


        attempts
            .slice()
            .reverse()
            .forEach(function(attempt) {

                const item = document.createElement("div");

                item.className = "history-item";


                const resultText =
                    attempt.result === "correct"
                        ? "✓ Верно"
                        : "✕ Ошибка";


                const resultClass =
                    attempt.result === "correct"
                        ? "status-correct"
                        : "status-wrong";


                const date = formatDate(attempt.date);


                item.innerHTML = `

                    <div class="history-result ${resultClass}">
                        ${resultText}
                    </div>

                    <div class="history-date">
                        ${date}
                    </div>

                    ${
                        attempt.errorText
                            ? `
                                <div class="history-error">
                                    ${escapeHtml(attempt.errorText)}
                                </div>
                              `
                            : ""
                    }

                    <div class="history-actions">

                        <button
                            class="small-button edit-button"
                            onclick="editAttempt('${attempt.id}')"
                        >
                            Изменить
                        </button>

                        <button
                            class="small-button delete-button"
                            onclick="deleteAttempt('${attempt.id}')"
                        >
                            Удалить
                        </button>

                    </div>

                `;


                container.appendChild(item);

            });

    }


    /* =====================================================
       РЕДАКТИРОВАНИЕ ПОПЫТКИ
    ===================================================== */

    function editAttempt(attemptId) {

        const attempts = getAttempts();

        const attempt = attempts.find(function(item) {

            return item.id === attemptId;

        });


        if (!attempt) {
            return;
        }


        if (attempt.result === "wrong") {

            const newText = prompt(
                "Измените описание ошибки:",
                attempt.errorText || ""
            );


            if (newText === null) {
                return;
            }


            if (!newText.trim()) {

                alert("Описание ошибки не может быть пустым.");

                return;
            }


            attempt.errorText = newText.trim();

        } else {

            const choice = confirm(
                "Изменить результат с «Верно» на «Ошибка»?"
            );


            if (!choice) {
                return;
            }


            const newText = prompt(
                "Напишите, в чём была ошибка:"
            );


            if (!newText || !newText.trim()) {
                return;
            }


            attempt.result = "wrong";

            attempt.errorText = newText.trim();

        }


        saveAttempts(attempts);

        renderHistory();

        updateVisibleContent();

    }


    /* =====================================================
       УДАЛЕНИЕ ПОПЫТКИ
    ===================================================== */

    function deleteAttempt(attemptId) {

        const shouldDelete = confirm(
            "Удалить эту попытку?"
        );


        if (!shouldDelete) {
            return;
        }


        const attempts = getAttempts().filter(function(attempt) {

            return attempt.id !== attemptId;

        });


        saveAttempts(attempts);

        renderHistory();

        updateVisibleContent();

    }


    /* =====================================================
       СТАТИСТИКА
    ===================================================== */

    function openStats() {

        hideAllPages();

        document.getElementById("statsPage").style.display = "block";

        renderStats();


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    function renderStats() {

        const container = document.getElementById("statsContent");

        const attempts = getAttempts();


        const uniqueTaskIds = new Set(
            attempts.map(function(attempt) {
                return attempt.taskId;
            })
        );


        const correctCount = attempts.filter(function(attempt) {

            return attempt.result === "correct";

        }).length;


        const wrongCount = attempts.filter(function(attempt) {

            return attempt.result === "wrong";

        }).length;


        const total = attempts.length;


        const accuracy = total > 0
            ? Math.round((correctCount / total) * 100)
            : 0;


        container.innerHTML = `

            <div class="stats-grid">

                <div class="stat-card">

                    <div class="stat-number">
                        ${uniqueTaskIds.size}
                    </div>

                    <div class="stat-label">
                        Заданий выполнено
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-number">
                        ${total}
                    </div>

                    <div class="stat-label">
                        Всего попыток
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-number">
                        ${correctCount}
                    </div>

                    <div class="stat-label">
                        Верных
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-number">
                        ${wrongCount}
                    </div>

                    <div class="stat-label">
                        Ошибок
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-number">
                        ${accuracy}%
                    </div>

                    <div class="stat-label">
                        Точность
                    </div>

                </div>

            </div>

        `;

    }


    /* =====================================================
       МОИ ОШИБКИ
    ===================================================== */

    function openErrors() {

        hideAllPages();

        document.getElementById("errorsPage").style.display = "block";

        renderErrors();


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    function renderErrors() {

        const container = document.getElementById("errorsContent");

        container.innerHTML = "";


        const attempts = getAttempts();


        const wrongAttempts = attempts.filter(function(attempt) {

            return attempt.result === "wrong";

        });


        if (wrongAttempts.length === 0) {

            container.innerHTML = `
                <div class="empty">
                    Ошибок пока нет 🎉
                </div>
            `;

            return;
        }


        /*
            Объединяем ошибки одного задания.
        */

        const grouped = {};


        wrongAttempts.forEach(function(attempt) {

            if (!grouped[attempt.taskId]) {

                grouped[attempt.taskId] = [];

            }


            grouped[attempt.taskId].push(attempt);

        });


        Object.keys(grouped).forEach(function(taskId) {

            const taskAttempts = grouped[taskId];

            const latest =
                taskAttempts[taskAttempts.length - 1];


            const task = TASKS.find(function(item) {

                return item.id === taskId;

            });


            if (!task) {
                return;
            }


            const card = document.createElement("div");

            card.className = "error-card";


            card.innerHTML = `

                <div class="error-title">
                    Вариант ${task.variant} · Задание ${task.number}
                </div>

                <div class="error-code">
                    ${escapeHtml(task.code)}
                </div>

                <div class="error-count">
                    Ошибок: ${taskAttempts.length}
                </div>

                <div class="error-text">
                    ${escapeHtml(latest.errorText || "Описание отсутствует")}
                </div>

            `;


            card.onclick = function() {

                openTask(task);

            };


            container.appendChild(card);

        });

    }


    /* =====================================================
       ОБНОВЛЕНИЕ ОТКРЫТОЙ СТРАНИЦЫ
    ===================================================== */

    function updateVisibleContent() {

        const sectionPage =
            document.getElementById("sectionPage");


        const statsPage =
            document.getElementById("statsPage");


        const errorsPage =
            document.getElementById("errorsPage");


        if (sectionPage.style.display !== "none") {

            const title =
                document.getElementById("sectionTitle")
                    .textContent;


            if (title === "Задания 1-5") {

                openSection("1-5");

            } else if (title === "Задания 6-11") {

                openSection("6-11");

            } else if (title === "Задания 12") {

                openSection("12");

            } else if (title === "Задания 13-19") {

                openSection("13-19");

            } else if (title === "Задания 20-28") {

                openSection("20-28");

            } else if (title === "Задания 29-34") {

                openSection("29-34");

            }

        }


        if (statsPage.style.display !== "none") {

            renderStats();

        }


        if (errorsPage.style.display !== "none") {

            renderErrors();

        }


        searchTasks();

    }


    /* =====================================================
       ДАТА
    ===================================================== */

    function formatDate(dateString) {

        const date = new Date(dateString);


        return date.toLocaleString(
            "ru-RU",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    }


    /* =====================================================
       ЗАЩИТА HTML
    ===================================================== */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =====================================================
       ЗАКРЫТИЕ МОДАЛКИ ПО НАЖАТИЮ НА ФОН
    ===================================================== */

    document
        .getElementById("modalOverlay")
        .addEventListener("click", function(event) {

            if (event.target === this) {

                closeModal();

            }

        });


    /* =====================================================
       TELEGRAM
    ===================================================== */

    if (
        window.Telegram &&
        window.Telegram.WebApp
    ) {

        window.Telegram.WebApp.ready();

        window.Telegram.WebApp.expand();

    }

</script>
