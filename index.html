<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>ОГЭ Английский — Трекер</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./data/tasks.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --purple:#d4b8e8;
  --purple-dark:#9b70bd;
  --purple-light:#f3eafa;
  --bg:#faf8fc;
  --card:#ffffff;
  --text:#29222f;
  --muted:#8c8294;
  --green:#42b883;
  --green-light:#e5f7ef;
  --red:#e65c68;
  --red-light:#fde9eb;
  --border:#eee6f3;
  --shadow:0 8px 28px rgba(93,63,112,.08);
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

body{
  padding-bottom:30px;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.hidden{
  display:none!important;
}

/* =========================
   LOADER
========================= */

#loader{
  position:fixed;
  inset:0;
  z-index:9999;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
}

.loader-box{
  text-align:center;
}

.loader-logo{
  width:68px;
  height:68px;
  margin:auto;
  border-radius:22px;
  background:var(--purple);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  box-shadow:var(--shadow);
  animation:pulse 1.4s infinite;
}

.loader-text{
  margin-top:14px;
  color:var(--muted);
  font-size:14px;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.05)}
}

/* =========================
   AUTH
========================= */

#authScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-card{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:28px;
  padding:28px 22px;
  box-shadow:var(--shadow);
}

.auth-logo{
  width:70px;
  height:70px;
  margin:0 auto 18px;
  border-radius:23px;
  background:var(--purple);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
}

.auth-title{
  text-align:center;
  font-size:26px;
  font-weight:800;
  margin-bottom:7px;
}

.auth-subtitle{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:24px;
}

.auth-tabs{
  display:flex;
  background:var(--purple-light);
  padding:4px;
  border-radius:14px;
  margin-bottom:20px;
}

.auth-tab{
  flex:1;
  padding:11px;
  border-radius:11px;
  background:transparent;
  color:var(--muted);
  font-weight:700;
}

.auth-tab.active{
  background:white;
  color:var(--purple-dark);
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input{
  width:100%;
  height:48px;
  padding:0 15px;
  border:1px solid var(--border);
  border-radius:14px;
  outline:none;
  background:#fff;
  color:var(--text);
}

.field input:focus{
  border-color:var(--purple-dark);
  box-shadow:0 0 0 3px rgba(155,112,189,.12);
}

.primary-btn{
  width:100%;
  height:50px;
  border-radius:15px;
  background:var(--purple);
  color:#3d2948;
  font-weight:800;
  margin-top:4px;
  transition:.2s;
}

.primary-btn:hover{
  background:#cba9e2;
}

.primary-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.forgot-btn{
  width:100%;
  background:none;
  color:var(--purple-dark);
  font-size:13px;
  font-weight:700;
  margin-top:15px;
}

.auth-message{
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  font-size:13px;
  line-height:1.4;
}

.auth-message.error{
  background:var(--red-light);
  color:#b52d3a;
}

.auth-message.success{
  background:var(--green-light);
  color:#25845d;
}

/* =========================
   APP
========================= */

#app{
  max-width:760px;
  margin:0 auto;
  padding:16px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-icon{
  width:44px;
  height:44px;
  border-radius:15px;
  background:var(--purple);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.brand-title{
  font-size:16px;
  font-weight:800;
}

.brand-subtitle{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.profile-btn{
  width:44px;
  height:44px;
  border-radius:15px;
  background:white;
  box-shadow:var(--shadow);
  font-size:19px;
}

.page{
  animation:fadeIn .22s ease;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

/* =========================
   HOME
========================= */

.greeting{
  margin-bottom:15px;
}

.greeting h1{
  margin:0;
  font-size:25px;
  line-height:1.15;
}

.greeting p{
  margin:7px 0 0;
  color:var(--muted);
  font-size:14px;
}

.quote-card{
  background:linear-gradient(135deg,#e8d5f2,#d4b8e8);
  border-radius:23px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:var(--shadow);
}

.quote-label{
  font-size:12px;
  font-weight:800;
  opacity:.65;
  margin-bottom:8px;
}

.quote{
  font-size:18px;
  font-weight:800;
  line-height:1.35;
}

.search-box{
  position:relative;
  margin-bottom:18px;
}

.search-box input{
  width:100%;
  height:50px;
  border:1px solid var(--border);
  border-radius:16px;
  background:white;
  padding:0 16px 0 44px;
  outline:none;
  box-shadow:var(--shadow);
}

.search-icon{
  position:absolute;
  left:15px;
  top:15px;
  font-size:18px;
}

.section-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.section-card{
  background:white;
  border-radius:21px;
  padding:17px;
  min-height:135px;
  box-shadow:var(--shadow);
  border:1px solid transparent;
  transition:.2s;
  text-align:left;
}

.section-card:hover{
  border-color:var(--purple);
  transform:translateY(-2px);
}

.section-number{
  width:37px;
  height:37px;
  border-radius:12px;
  background:var(--purple-light);
  color:var(--purple-dark);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  margin-bottom:12px;
}

.section-title{
  font-weight:800;
  line-height:1.25;
}

.section-count{
  margin-top:7px;
  font-size:12px;
  color:var(--muted);
}

/* =========================
   SECTION
========================= */

.back-btn{
  background:white;
  border-radius:13px;
  padding:9px 13px;
  box-shadow:var(--shadow);
  margin-bottom:15px;
  color:var(--purple-dark);
  font-weight:800;
}

.section-header{
  margin-bottom:18px;
}

.section-header h1{
  margin:0;
  font-size:24px;
}

.section-header p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:13px;
}

.task-card{
  background:white;
  border-radius:21px;
  padding:18px;
  margin-bottom:13px;
  box-shadow:var(--shadow);
}

.task-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.task-code{
  font-weight:900;
  font-size:17px;
}

.task-id{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
  word-break:break-all;
}

.task-attempt-btn{
  background:var(--purple-light);
  color:var(--purple-dark);
  border-radius:12px;
  padding:9px 11px;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
}

.task-text{
  margin-top:14px;
  font-size:14px;
  line-height:1.55;
}

.attempt-box{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--border);
}

.result-buttons{
  display:flex;
  gap:9px;
}

.result-btn{
  flex:1;
  height:42px;
  border-radius:12px;
  font-weight:900;
}

.result-btn.correct{
  background:var(--green-light);
  color:#25845d;
}

.result-btn.wrong{
  background:var(--red-light);
  color:#c03948;
}

.reason-input{
  width:100%;
  height:43px;
  margin-top:9px;
  padding:0 12px;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
}

.save-attempt{
  width:100%;
  height:43px;
  margin-top:9px;
  border-radius:12px;
  background:var(--purple);
  color:#3d2948;
  font-weight:800;
}

.history{
  margin-top:15px;
}

.history-title{
  font-size:12px;
  font-weight:800;
  color:var(--muted);
  margin-bottom:7px;
}

.history-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:9px 10px;
  background:#faf8fc;
  border-radius:10px;
  margin-bottom:5px;
  font-size:12px;
}

.history-result.correct{
  color:#25845d;
  font-weight:900;
}

.history-result.wrong{
  color:#c03948;
  font-weight:900;
}

/* =========================
   PROFILE / STATS
========================= */

.profile-card,
.stat-card{
  background:white;
  border-radius:21px;
  padding:18px;
  box-shadow:var(--shadow);
  margin-bottom:13px;
}

.profile-main{
  display:flex;
  align-items:center;
  gap:13px;
  margin-bottom:18px;
}

.avatar{
  width:58px;
  height:58px;
  border-radius:19px;
  background:var(--purple);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:900;
}

.profile-name{
  font-size:19px;
  font-weight:900;
}

.profile-email{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
  word-break:break-all;
}

.stat-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
}

.stat-value{
  font-size:25px;
  font-weight:900;
}

.progress{
  height:9px;
  border-radius:10px;
  background:#f0ebf3;
  overflow:hidden;
  margin-top:9px;
}

.progress-fill{
  height:100%;
  border-radius:10px;
  background:var(--purple-dark);
  transition:width .4s;
}

.progress-fill.green{
  background:var(--green);
}

.progress-fill.red{
  background:var(--red);
}

.stat-description{
  margin-top:7px;
  color:var(--muted);
  font-size:12px;
}

.edit-name{
  display:flex;
  gap:8px;
  margin-top:14px;
}

.edit-name input{
  flex:1;
  min-width:0;
  height:43px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 12px;
  outline:none;
}

.small-btn{
  padding:0 14px;
  height:43px;
  border-radius:12px;
  background:var(--purple);
  font-weight:800;
}

.logout-btn{
  width:100%;
  height:46px;
  border-radius:13px;
  background:var(--red-light);
  color:#c03948;
  font-weight:800;
  margin-top:5px;
}

.error-topic{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid var(--border);
  font-size:13px;
}

.error-topic:last-child{
  border-bottom:0;
}

/* =========================
   EMPTY / SEARCH
========================= */

.empty{
  text-align:center;
  background:white;
  border-radius:20px;
  padding:30px 18px;
  box-shadow:var(--shadow);
  color:var(--muted);
  font-size:14px;
}

.search-results{
  margin-top:10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){
  #app{
    padding:13px;
  }

  .section-grid{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .section-card{
    min-height:128px;
    padding:14px;
  }

  .section-title{
    font-size:13px;
  }

  .quote{
    font-size:16px;
  }
}

@media(max-width:360px){
  .section-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<div id="loader">
  <div class="loader-box">
    <div class="loader-logo">📚</div>

</div>

<!-- =========================

      <input

        type="email"
        placeholder="example@mail.ru"
        autocomplete="email">
    </div>

    <div class="field" id="passwordField">
      <label>Пароль</label>
      <input
        id="passwordInput"
        type="password"
        placeholder="Минимум 6 символов"
        autocomplete="current-password">
    </div>

    <button
      id="authButton"
      class="primary-btn"
      onclick="submitAuth()">
      Войти
    </button>

    <button
      id="forgotButton"
      class="forgot-btn"
      onclick="forgotPassword()">
      Забыли пароль?
    </button>

    <div id="authMessage" class="hidden"></div>

  </div>

</div>

<!-- =========================
     APP
========================= -->

<div id="app" class="hidden">

    </div>

    <button
      class="profile-btn"
      onclick="showProfile()">
      👤
    </button>

  </div>

  <div id="content"></div>

</div>

    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

function todayMoscow(){

  const now = new Date();

  return new Intl.DateTimeFormat(
    "ru-RU",
    {
      timeZone:"Europe/Moscow",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).format(now);

}

  for(let i=0;i<date.length;i++){
    number += Number(date[i]);
  }

  return QUOTES[number % QUOTES.length];

/* =========================================================
   TASK LOADING
========================================================= */

function findTaskArray(){

  const possible = [

    window.tasks,
    window.TASKS,
    window.taskData,
    window.tasksData,
    window.questions,
    window.QUESTIONS

  ];

  for(const item of possible){

    if(Array.isArray(item)){
      return item;
    }

    if(item && Array.isArray(item.tasks)){
      return item.tasks;
    }

    if(item && Array.isArray(item.data)){
      return item.data;
    }

  }

  return [];
}


function normalizeTask(raw,index){

  if(typeof raw === "string"){

    return {
      id:raw,
      code:raw,
      text:"",
      raw:raw
    };

  }

  if(!raw || typeof raw !== "object"){

    return {
      id:"task-"+index,
      code:String(index+1),
      text:"",
      raw
    };

  }

  const id =
    raw.id ??
    raw.task_id ??
    raw.code ??
    raw.hash ??
    raw.uuid ??
    ("task-"+index);

  const code =
    raw.code ??
    raw.taskCode ??
    raw.task_code ??
    raw.number ??
    raw.id ??
    id;

  const text =
    raw.text ??
    raw.question ??
    raw.title ??
    raw.description ??
    raw.content ??
    "";

  return {
    ...raw,
    id:String(id),
    code:String(code),
    text:String(text)
  };

}


function loadTasks(){

  const source = findTaskArray();

  allTasks = source.map(normalizeTask);

  /*
    Если tasks.js не содержит массив, создаём
    задачи по указанным кодам, чтобы раздел 1–5
    всё равно отображался.
  */

  if(allTasks.length === 0){

    const codes =
      SECTIONS[0].codes;

    allTasks =
      codes.map((code,index)=>({
        id:code,
        code:code,
        text:"",
        section:"1-5"
      }));

  }

  /*
    Добавляем задачи по кодам в массив,
    если их нет среди tasks.js.
  */

  const existing =
    new Set(
      allTasks.map(t => String(t.id))
    );

  for(const section of SECTIONS){

    for(const code of section.codes){

      if(!existing.has(code)){

        allTasks.push({
          id:code,
          code:code,
          text:"",
          section:section.id
        });

      }

    }

  }

}


/* =========================================================
   TASK SECTION DETECTION
========================================================= */

function taskBelongsToSection(task,section){

  if(
    task.section &&
    String(task.section) === section.id
  ){
    return true;
  }

  if(
    task.sectionId &&
    String(task.sectionId) === section.id
  ){
    return true;
  }

  if(
    task.block &&
    String(task.block) === section.id
  ){
    return true;
  }

  if(
    section.id === "1-5" &&
    section.codes.includes(String(task.id))
  ){
    return true;
  }

  if(
    section.codes.includes(String(task.code))
  ){
    return true;
  }

  /*
    Для остальных блоков, если в tasks.js
    указан номер задания.
  */

  const n =
    Number(
      task.taskNumber ??
      task.task_number ??
      task.number
    );

  if(Number.isFinite(n)){

    if(
      section.id === "1-5" &&
      n >= 1 &&
      n <= 5
    ) return true;

    if(
      section.id === "6-11" &&
      n >= 6 &&
      n <= 11
    ) return true;

    if(
      section.id === "12" &&
      n === 12
    ) return true;

    if(
      section.id === "13-19" &&
      n >= 13 &&
      n <= 19
    ) return true;

    if(
      section.id === "20-28" &&
      n >= 20 &&
      n <= 28
    ) return true;

    if(
      section.id === "29-34" &&
      n >= 29 &&
      n <= 34
    ) return true;

  }

  return false;
}


function getSectionTasks(section){

  return allTasks.filter(
    task => taskBelongsToSection(task,section)
  );

}

async function submitAuth(){

  const email =
    $("emailInput").value.trim();

  const password =
    $("passwordInput").value;

  if(!email){

    showMessage("Введите email.");

    return;

  }

  if(!password || password.length < 6){

    showMessage(
      "Пароль должен содержать минимум 6 символов."
    );

    return;

  }

  const button =
    $("authButton");

  button.disabled = true;

  try{

    if(authMode === "login"){

      const {data,error} =
        await sb.auth.signInWithPassword({
          email,
          password
        });

      if(error){
        throw error;
      }

      currentUser =
        data.user;

      await afterLogin();

    }else{

      const nickname =
        $("nicknameInput")
          .value
          .trim();

      if(!nickname){

        showMessage(
          "Введите имя или никнейм."
        );

        button.disabled = false;

        return;
      }

      const {data,error} =
        await sb.auth.signUp({
          email,
          password,
          options:{
            data:{
              nickname
            }
          }
        });

      if(error){
        throw error;
      }

      if(data.session){

        currentUser =
          data.user;

        await afterLogin();

      }else{

        showMessage(
          "Регистрация создана. Проверьте почту и подтвердите email.",
          "success"
        );

      }

    }

  }catch(error){

    console.error(error);

    showMessage(
      readableAuthError(error)
    );

  }finally{

    button.disabled = false;

  }

}


function readableAuthError(error){

  const message =
    String(
      error?.message || error || ""
    );

  const lower =
    message.toLowerCase();

  if(
    lower.includes("invalid login") ||
    lower.includes("invalid credentials")
  ){
    return "Неверный email или пароль.";
  }

  if(
    lower.includes("email not confirmed")
  ){
    return "Сначала подтвердите email через письмо от Supabase.";
  }

  if(
    lower.includes("already registered") ||
    lower.includes("already been registered")
  ){
    return "Этот email уже зарегистрирован. Попробуйте войти.";
  }

  if(
    lower.includes("password")
  ){
    return "Проверьте пароль. Минимум 6 символов.";
  }

  return message || "Не удалось выполнить вход.";
}

async function loadUserData(){

    return;
  }

  profileData.nickname =
    currentUser.user_metadata?.nickname ||
    currentUser.user_metadata?.name ||
    currentUser.email?.split("@")[0] ||
    "Ученик";

  progressData = {};
  historyData = [];

  try{

    const progressResponse =
      await sb
        .from("progress")
        .select("*")
        .eq("user_id",currentUser.id);

    if(!progressResponse.error){

      for(
        const row
        of progressResponse.data || []
      ){

        progressData[
          String(row.task_id)
        ] = row;

      }

    }

  }catch(error){

    console.error(
      "Progress loading error:",
      error
    );

  }

  try{

    const historyResponse =
      await sb
        .from("attempt_history")
        .select("*")
        .eq("user_id",currentUser.id)
        .order("created_at",{ascending:false})
        .limit(1000);

    if(!historyResponse.error){

      historyData =
        historyResponse.data || [];

    }

  }catch(error){

    console.error(
      "History loading error:",
      error
    );

  }

}

function taskWord(number){

  if(number % 10 === 1 && number % 100 !== 11){
    return "задание";
  }

  if(
    [2,3,4].includes(number % 10) &&
    ![12,13,14].includes(number % 100)
  ){
    return "задания";
  }

  return "заданий";
}


function searchTasks(value){

  const q =
    value
      .trim()
      .toLowerCase();

  const results =
    $("searchResults");

  if(!q){

    results.innerHTML = "";

    return;
  }

  const found =
    allTasks
      .filter(task =>
        String(task.id)
          .toLowerCase()
          .includes(q) ||
        String(task.code)
          .toLowerCase()
          .includes(q)
      )
      .slice(0,30);

  if(found.length === 0){

    results.innerHTML = `
      <div class="empty">
        Заданий с таким кодом не найдено.
      </div>
    `;

    return;
  }

  results.innerHTML = `

    <div class="search-results">

      ${found.map(task => {

        return renderTaskCard(
          task,
          null
        );

      }).join("")}

    </div>

  `;

function formatTaskText(text){

  return escapeHtml(text)
    .replace(/\n/g,"<br>");
}


function openAttempt(id){

  const box =
    $("attempt-"+id);

  if(box){
    box.classList.remove("hidden");
  }

}


const selectedResults = {};


function chooseResult(id,result){

  selectedResults[id] =
    result;

  const reason =
    $("reason-"+id);

  if(reason){

    reason.classList.toggle(
      "hidden",
      result !== "wrong"
    );

  }

}


async function saveAttempt(id){

  if(!currentUser){

    return;
  }

  const result =
    selectedResults[id];

  if(!result){

    alert(
      "Сначала выберите результат."
    );

    return;
  }

  let reason = "";

  if(result === "wrong"){

    reason =
      $("reason-input-"+id)
        ?.value
        .trim() || "";

    if(!reason){

      alert(
        "Напишите тему ошибки."
      );

      return;
    }

  }

  const correct =
    result === "correct";

  const now =
    new Date().toISOString();

  try{

    /*
      1. Сохраняем каждую попытку
    */

    const historyInsert =
      await sb
        .from("attempt_history")
        .insert({
          id:crypto.randomUUID(),
          user_id:currentUser.id,
          task_id:id,
          result,
          correct,
          reason,
          created_at:now
        });

    if(historyInsert.error){
      throw historyInsert.error;
    }

    /*
      2. Обновляем последний результат
    */

    const progressUpsert =
      await sb
        .from("progress")
        .upsert(
          {
            user_id:currentUser.id,
            task_id:id,
            result,
            correct,
            reason,
            updated_at:now
          },
          {
            onConflict:"user_id,task_id"
          }
        );

    if(progressUpsert.error){
      throw progressUpsert.error;
    }

    await loadUserData();

    if(currentPage === "section"){

      showSection(
        currentSection.id
      );

    }else{

      showHome();

    }

  }catch(error){

    console.error(error);

    alert(
      "Не удалось сохранить попытку: " +
      (error.message || error)
    );

  }

}

          ${stats.wrong} ошибок из ${stats.solved}
        </div>

      </div>

      <div class="stat-card">

        <div class="stat-title">
          Активность
        </div>

        <div class="stat-description">
          Попыток за последние 7 дней:
          <b>${stats.last7}</b>
        </div>

        <div
          class="stat-description"
          style="margin-top:8px">
          Попыток за последние 30 дней:
          <b>${stats.last30}</b>
        </div>

      </div>

      <div class="stat-card">

        <div class="stat-title">
          Частые темы ошибок
        </div>

        ${
          stats.topErrors.length
            ? stats.topErrors
                .map(item => `

                  <div class="error-topic">

                    <span>
                      ${escapeHtml(item.name)}
                    </span>

                    <b>
                      ${item.count}
                    </b>

                  </div>

                `)
                .join("")
            : `
              <div class="stat-description">
                Пока ошибок с указанной темой нет.
              </div>
            `
        }

      </div>

      <button
        class="logout-btn"
        onclick="logout()">
        Выйти из аккаунта
      </button>

    </div>

  `;

}


function getInitials(name){

  const words =
    String(name || "У")
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  if(words.length === 1){
    return words[0][0].toUpperCase();
  }

  return (
    words[0][0] +
    words[1][0]
  ).toUpperCase();

}


async function saveNickname(){

  const input =
    $("newNickname");

  const nickname =
    input?.value.trim();

  if(!nickname){

    alert(
      "Введите имя."
    );

    return;
  }

  try{

    const {error} =
      await sb.auth.updateUser({
        data:{
          nickname
        }
      });

    if(error){
      throw error;
    }

    profileData.nickname =
      nickname;

    currentUser.user_metadata =
      {
        ...currentUser.user_metadata,
        nickname
      };

    showProfile();

  }catch(error){

    alert(
      error.message ||
      "Не удалось сохранить имя."
    );

  }

}


/* =========================================================
   STATS
========================================================= */

function calculateStats(){

  const total =
    allTasks.length;

  const attempted =
    Object.keys(progressData).length;

  const solved =
    attempted;

  const correct =
    Object.values(progressData)
      .filter(row => row.correct)
      .length;

  const wrong =
    solved - correct;

  const attemptedPercent =
    total
      ? Math.round(
          attempted / total * 100
        )
      : 0;

  const correctPercent =
    solved
      ? Math.round(
          correct / solved * 100
        )
      : 0;

  const wrongPercent =
    solved
      ? Math.round(
          wrong / solved * 100
        )
      : 0;

  const now =
    Date.now();

  const last7 =
    historyData.filter(row => {

      const t =
        new Date(row.created_at)
          .getTime();

      return (
        now - t <=
        7 * 24 * 60 * 60 * 1000
      );

    }).length;

  const last30 =
    historyData.filter(row => {

      const t =
        new Date(row.created_at)
          .getTime();

      return (
        now - t <=
        30 * 24 * 60 * 60 * 1000
      );

    }).length;

  const reasons = {};

  historyData
    .filter(row =>
      row.reason &&
      String(row.reason).trim()
    )
    .forEach(row => {

      const reason =
        String(row.reason).trim();

      reasons[reason] =
        (reasons[reason] || 0) + 1;

    });

  const topErrors =
    Object.entries(reasons)
      .sort(
        (a,b) => b[1] - a[1]
      )
      .slice(0,5)
      .map(
        ([name,count]) => ({
          name,
          count
        })
      );

  return {
    total,
    attempted,
    solved,
    correct,
    wrong,
    attemptedPercent,
    correctPercent,
    wrongPercent,
    last7,
    last30,
    topErrors
  };

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  try{

    await sb.auth.signOut();

  }catch(error){

    console.error(error);

  }

  currentUser = null;
  progressData = {};
  historyData = {};

  $("app")
    .classList.add("hidden");

  $("authScreen")
    .classList.remove("hidden");

  $("emailInput").value = "";
  $("passwordInput").value = "";
  $("nicknameInput").value = "";

  switchAuth("login");

}


/* =========================================================
   DATE
========================================================= */

function formatDate(date){

  if(!date){
    return "";
  }

  try{

    return new Intl.DateTimeFormat(
      "ru-RU",
      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
      }
    ).format(
      new Date(date)
    );

  }catch(e){

    return String(date);

  }

}


/* =========================================================
   PASSWORD RECOVERY
========================================================= */

sb.auth.onAuthStateChange(
  async (event,session) => {

    if(event === "PASSWORD_RECOVERY"){

      const password =
        prompt(
          "Введите новый пароль:"
        );

      if(!password){
        return;
      }

      if(password.length < 6){

        alert(
          "Пароль должен быть минимум 6 символов."
        );

        return;
      }

      const {error} =
        await sb.auth.updateUser({
          password
        });

      if(error){

        alert(
          error.message
        );

      }else{

        alert(
          "Пароль успешно изменён."
        );

      }

    }

  }
);


/* =========================================================
   INIT
========================================================= */

async function init(){

  try{

    loadTasks();

    const {
      data,
      error
    } =
      await sb.auth.getSession();

    if(error){
      console.error(error);
    }

    if(data?.session?.user){

      currentUser =
        data.session.user;

      await afterLogin();

    }else{

      $("authScreen")
        .classList.remove("hidden");

    }

  }catch(error){

    console.error(error);

    $("authScreen")
      .classList.remove("hidden");

  }finally{

    hideLoader();

  }

}


/* =========================================================
   START
========================================================= */

init();
